<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>synqux demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #count {
        font-size: 4rem;
        font-weight: bold;
        text-align: center;
        margin: 1rem 0;
      }
      .buttons {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
      }
      button {
        font-size: 1.2rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      #result {
        color: #c00;
        min-height: 1.5em;
        text-align: center;
        margin-top: 0.5rem;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 1rem;
        font-size: 0.9rem;
        color: #555;
      }
      dd {
        margin: 0;
      }
      ul {
        margin: 0.25rem 0;
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <h1>synqux demo</h1>
    <p>
      複数タブで開いて同期を確認する。<code>?group=</code> で部屋を、
      <code>?role=dedicated|observer</code> で役割を変えられる。
    </p>

    <div id="count">0</div>
    <div class="buttons">
      <button id="sub1">-1</button>
      <button id="add1">+1</button>
      <button id="add10">+10</button>
      <button id="reset">reset</button>
    </div>
    <p id="result"></p>

    <dl>
      <dt>status</dt>
      <dd id="status">connecting...</dd>
      <dt>group</dt>
      <dd id="group"></dd>
      <dt>self</dt>
      <dd id="self"></dd>
      <dt>role</dt>
      <dd id="role"></dd>
      <dt>host?</dt>
      <dd id="host"></dd>
      <dt>peers</dt>
      <dd><ul id="peers"></ul></dd>
    </dl>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
