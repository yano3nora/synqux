# mise : node 管理と git-hook 管理のみ利用する
# https://mise.jdx.dev/
#
# - node  : ホストの node を pin。バージョン変更時は package.json engines と手動同期する
# - hooks : husky の代替。pre-commit=check（軽量）/ pre-push=test（tsc/vitest 込み）に分離。
#           `mise run install-hooks` で .git/hooks へ生成する
[settings]
experimental = true

# [hooks]
# enter = [
#   "echo '🍳 mise enabled'",
#   "mise env --json | jq -r 'keys | join(\" \")'",
# ]

[shell_alias]
provision = "mise run provision"

[tools]
node = "24.14.1"

[tasks.pre-commit]
description = "pre-commit: fix lint, format & run type check, tests"
run = [
  "npm run fix",
  "npm test"
]

[tasks.provision]
description = "環境を最初に構成する際のセットアップ"
run = [
  "mise generate git-pre-commit --task pre-commit --write",
  "npm ci",
]

# Release : version の 3 点同期・test/build/smoke・publish ゲートを scripts/release.mjs に集約。
#           npm publish が配布本体、GitHub Release は gh --generate-notes で作る (詳細は README)。
[tasks."release:prepare"]
description = "Bump version, sync src, run test/build/smoke (no publish)"
run = "node scripts/release.mjs prepare"

[tasks."release:publish"]
description = "Push tag, npm publish, and create the GitHub Release (human-only)"
run = "node scripts/release.mjs publish"
